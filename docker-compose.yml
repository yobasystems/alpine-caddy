services:
  caddy:
    image: yobasystems/alpine-caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "2015:2015"
    volumes:
      - ./Caddyfile:/etc/Caddyfile
      - ./www:/srv
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2015/"]
      interval: 30s
      timeout: 10s
      retries: 3
